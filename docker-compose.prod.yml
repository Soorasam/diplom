# Продакшен на VPS: Postgres + MinIO + API (только localhost:3000 снаружи — перед ним nginx)
# Запуск из корня репозитория:
#   cp deploy/.env.production.example .env.production
#   # отредактируйте пароли и домен
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coop} -d ${POSTGRES_DB:-coop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb local/${MINIO_BUCKET:-coop-products} --ignore-existing &&
      mc mb local/${MINIO_DRIVER_BUCKET:-coop-driver-docs} --ignore-existing &&
      mc anonymous set download local/${MINIO_BUCKET:-coop-products} &&
      echo 'MinIO buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-coop-products}
      MINIO_DRIVER_BUCKET: ${MINIO_DRIVER_BUCKET:-coop-driver-docs}

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coop}?schema=public
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  minio_data:
