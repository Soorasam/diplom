services:
  db:
    image: postgres:16-alpine
    container_name: diplom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: coop
      POSTGRES_DB: coop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop -d coop"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: diplom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    container_name: diplom-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/coop-products --ignore-existing &&
      mc mb local/coop-driver-docs --ignore-existing &&
      mc mb local/coop-tickets --ignore-existing &&
      mc mb local/coop-receipts --ignore-existing &&
      mc anonymous set download local/coop-products &&
      mc anonymous set download local/coop-driver-docs &&
      mc anonymous set download local/coop-tickets &&
      mc anonymous set download local/coop-receipts &&
      echo 'MinIO buckets ready'
      "

volumes:
  postgres_data:
  minio_data:
