services:
  db:
    image: postgres:16-alpine
    container_name: diplom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: coop
      POSTGRES_DB: coop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop -d coop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
