# Пример для Ubuntu: /etc/nginx/sites-available/coop
# Замените coop.example.ru на ваш домен, затем:
#   sudo ln -s /etc/nginx/sites-available/coop /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d coop.example.ru
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name coop.example.ru;

    # После certbot здесь будет listen 443 ssl

    client_max_body_size 20M;

    # NestJS API (префикс /api/v1 в приложении)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    # Публичные картинки MinIO (bucket coop-products)
    location /coop-products/ {
        proxy_pass http://127.0.0.1:9000/coop-products/;
        proxy_set_header Host $host;
    }

    location /coop-driver-docs/ {
        proxy_pass http://127.0.0.1:9000/coop-driver-docs/;
        proxy_set_header Host $host;
    }
}

# MinIO только на localhost — добавьте в docker-compose.prod.yml для отладки:
#   minio:
#     ports:
#       - "127.0.0.1:9000:9000"
