server {
    listen 80;
    server_name coopykt.ru www.coopykt.ru;
    return 301 https://coopykt.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name coopykt.ru;

    ssl_certificate /etc/letsencrypt/live/coopykt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coopykt.ru/privkey.pem;

    root /var/www/coopykt;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /coop-products/ {
        proxy_pass http://127.0.0.1:9000/coop-products/;
        proxy_set_header Host $host;
    }

    location /coop-driver-docs/ {
        proxy_pass http://127.0.0.1:9000/coop-driver-docs/;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name www.coopykt.ru;

    ssl_certificate /etc/letsencrypt/live/coopykt.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coopykt.ru/privkey.pem;

    return 301 https://coopykt.ru$request_uri;
}
